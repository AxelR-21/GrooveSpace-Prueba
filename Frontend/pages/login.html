
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - GrooveSpace</title>

    <link rel="stylesheet" href="../css/styles.css">

    <!-- Diseño móvil, solo se carga en pantallas chicas -->
    <link rel="stylesheet" href="../css/mobile.css" media="(max-width: 767px)">
</head>

<body class="pagina-auth">

    <!-- Encabezado -->
    <header>
        <a href="../index.html">
            <img src="../img/logo.png" alt="GrooveSpace Logo" class="logo">
        </a>

        <button id="toggle-dark" class="btn-dark">🌙</button>

        <p>Accedé a tu cuenta o registrate</p>
    </header>

    <main class="auth-container">

        <!-- Formulario de inicio de sesión -->
        <section class="login-card">

            <h2>Iniciar Sesión</h2>

            <form id="loginForm">

                <label for="usuario">Usuario o correo electrónico:</label>

                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    autocomplete="username"
                    autocapitalize="none"
                    placeholder="Ingresá tu usuario o correo"
                    required
                >

                <label for="password">Contraseña:</label>

                <!-- Campo de contraseña con botón mostrar/ocultar -->
                <div class="campo-pass">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        required
                    >

                    <button type="button" class="ojo solo-movil">
                        Mostrar
                    </button>

                </div>

                <button type="submit" class="btn-morado">
                    Login
                </button>

            </form>

            <p>
                <a href="#">¿Olvidaste tu contraseña?</a>
            </p>

        </section>

        <!-- Formulario de registro para PC -->
        <section class="login-card solo-pc">

            <h2>¿Aún no estás registrado?</h2>

            <form action="registro.html" method="get">

                <label for="email">Correo electrónico:</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >

                <label for="newpass">Contraseña:</label>

                <input
                    type="password"
                    id="newpass"
                    name="newpass"
                    required
                >

                <button type="submit" class="btn-morado">
                    Registrarse
                </button>

            </form>

        </section>

        <!-- Enlace de registro para móviles -->
        <p class="solo-movil m-registro">
            ¿Todavía no tenés cuenta?
            <a href="registro.html">Registrate</a>
        </p>

    </main>

    <!-- Pie de página -->
    <footer>
        <p>GrooveSpace - Tu lugar, tu música</p>
    </footer>

    <!-- Navegación inferior para móviles -->
    <nav class="bottom-nav">

        <a href="../index.html" class="nav-item" id="nav-home">
            <svg viewBox="0 0 24 24">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
        </a>

        <a href="mis_reservas.html" class="nav-item" id="nav-reservas">
            <svg viewBox="0 0 24 24">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
        </a>

        <a href="reservar.html" class="nav-item nav-item-center" id="nav-reservar">
            <div class="plus-btn">+</div>
        </a>

        <a href="salas.html" class="nav-item" id="nav-salas">
            <svg viewBox="0 0 24 24">
                <path d="M9 18V5l12-2v13"/>
                <circle cx="6" cy="18" r="3"/>
                <circle cx="18" cy="16" r="3"/>
            </svg>
        </a>

        <a href="login.html" class="nav-item active" id="nav-login">
            <svg viewBox="0 0 24 24">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
        </a>

    </nav>

    <!-- JavaScript general del sitio -->
    <script src="../js/script.js"></script>

    <!-- JavaScript encargado del login y registro -->
    <script src="../js/auth.js"></script>

</body>
</html>
